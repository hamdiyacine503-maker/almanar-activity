<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابتدائية المنار القرآنية إناث - أفضل نشاط شهر أكتوبر 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-rose: #f43f5e;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] {
      --bg-primary: #f0fdf4;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.85);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent-cyan: #0284c7;
      --accent-gold: #d97706;
      --accent-green: #059669;
      --accent-rose: #e11d48;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 35px 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .header-top-controls {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .btn-icon:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .school-title {
      font-size: 2.6rem;
      font-weight: 900;
      text-align: center;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 
        0 0 10px rgba(56, 189, 248, 0.8),
        0 0 20px rgba(56, 189, 248, 0.6),
        0 0 30px rgba(6, 182, 212, 0.8),
        0 0 40px rgba(6, 182, 212, 0.6);
      animation: neonGlow 2.5s infinite alternate;
    }

    @keyframes neonGlow {
      0% {
        text-shadow: 
          0 0 10px rgba(56, 189, 248, 0.6),
          0 0 20px rgba(56, 189, 248, 0.4),
          0 0 30px rgba(6, 182, 212, 0.6);
      }
      100% {
        text-shadow: 
          0 0 15px rgba(56, 189, 248, 1),
          0 0 25px rgba(6, 182, 212, 0.9),
          0 0 35px rgba(6, 182, 212, 0.8);
      }
    }

    .event-title {
      font-size: 1.2rem;
      color: var(--accent-gold);
      font-weight: 700;
      background: rgba(245, 158, 11, 0.1);
      padding: 6px 20px;
      border-radius: 50px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .admin-bar {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      padding: 12px 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .admin-bar.active {
      display: flex;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .leaderboard-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .podium-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .podium-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .podium-card.rank-1 { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 0.3); }
    .podium-card.rank-2 { border-color: #94a3b8; box-shadow: 0 0 20px rgba(148, 163, 184, 0.3); }
    .podium-card.rank-3 { border-color: #b45309; box-shadow: 0 0 20px rgba(180, 83, 9, 0.3); }

    .badge-rank {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      color: white;
    }

    .rank-1 .badge-rank { background: #f59e0b; }
    .rank-2 .badge-rank { background: #94a3b8; }
    .rank-3 .badge-rank { background: #b45309; }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 40px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    input, select, textarea {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-cyan);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-cyan), #3b82f6);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }

    .activities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .activity-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .activity-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #000;
    }

    .activity-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .teacher-name {
      color: var(--accent-cyan);
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .activity-topic {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
