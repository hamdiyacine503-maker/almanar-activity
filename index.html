<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابتدائية المنار القرآنية إناث - أفضل نشاط شهر أكتوبر 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-rose: #f43f5e;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] {
      --bg-primary: #f0fdf4;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.85);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent-cyan: #0284c7;
      --accent-gold: #d97706;
      --accent-green: #059669;
      --accent-rose: #e11d48;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
      z-index: -1;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 35px 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .header-top-controls {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .btn-icon:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .school-title {
      font-size: 2.6rem;
      font-weight: 900;
      text-align: center;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 
        0 0 10px rgba(56, 189, 248, 0.8),
        0 0 20px rgba(56, 189, 248, 0.6),
        0 0 30px rgba(6, 182, 212, 0.8),
        0 0 40px rgba(6, 182, 212, 0.6);
      animation: neonGlow 2.5s infinite alternate;
    }

    @keyframes neonGlow {
      0% {
        text-shadow: 
          0 0 10px rgba(56, 189, 248, 0.6),
          0 0 20px rgba(56, 189, 248, 0.4),
          0 0 30px rgba(6, 182, 212, 0.6);
      }
      100% {
        text-shadow: 
          0 0 15px rgba(56, 189, 248, 1),
          0 0 25px rgba(6, 182, 212, 0.9),
          0 0 35px rgba(6, 182, 212, 0.8);
      }
    }

    .event-title {
      font-size: 1.2rem;
      color: var(--accent-gold);
      font-weight: 700;
      background: rgba(245, 158, 11, 0.1);
      padding: 6px 20px;
      border-radius: 50px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .admin-bar {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      padding: 12px 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .admin-bar.active {
      display: flex;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .leaderboard-section {
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .podium-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .podium-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .podium-card.rank-1 { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 0.3); }
    .podium-card.rank-2 { border-color: #94a3b8; box-shadow: 0 0 20px rgba(148, 163, 184, 0.3); }
    .podium-card.rank-3 { border-color: #b45309; box-shadow: 0 0 20px rgba(180, 83, 9, 0.3); }

    .badge-rank {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      color: white;
    }

    .rank-1 .badge-rank { background: #f59e0b; }
    .rank-2 .badge-rank { background: #94a3b8; }
    .rank-3 .badge-rank { background: #b45309; }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 40px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    input, select, textarea {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-cyan);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-cyan), #3b82f6);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }

    .activities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .activity-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .activity-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #000;
    }

    .activity-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .teacher-name {
      color: var(--accent-cyan);
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .activity-topic {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .activity-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .activity-footer {
      margin-top: auto;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-like {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--accent-rose);
      padding: 8px 16px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-like.liked {
      background: var(--accent-rose);
      color: white;
    }

    .admin-card-actions {
      position: absolute;
      top: 10px;
      left: 10px;
      display: none;
      gap: 5px;
    }

    body.is-admin .admin-card-actions {
      display: flex;
    }

    .btn-delete-card {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .user-votes-badge {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-green);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top-controls">
        <button class="btn-icon" id="themeToggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
        <button class="btn-icon" id="adminToggle" title="تسجيل دخول الإدارة"><i class="fa-solid fa-user-shield"></i></button>
      </div>

      <h1 class="school-title">ابتدائية المنار القرآنية إناث</h1>
      <div class="event-title">🏆 مسابقة أفضل نشاط تربوي - شهر أكتوبر 2026م</div>
    </header>

    <div class="admin-bar" id="adminBar">
      <span>⚙️ <strong>لوحة الإدارة (مفعلة):</strong> يمكنك مسح الأنشطة نهائياً.</span>
      <button class="btn-danger" id="btnClearAll">مسح جميع الأنشطة</button>
    </div>

    <main>
      <section class="form-card">
        <h2 class="section-title"><i class="fa-solid fa-plus-circle"></i> إضافة نشاط جديد</h2>
        <form id="activityForm">
          <div class="form-grid">
            <div class="form-group">
              <label>اسم الأستاذ(ة)</label>
              <input type="text" id="teacherName" required placeholder="أدخل الاسم واللقب">
            </div>
            <div class="form-group">
              <label>موضوع النشاط</label>
              <input type="text" id="activityTopic" required placeholder="عنوان أو موضوع النشاط">
            </div>
            <div class="form-group">
              <label>الفئة المستهدفة</label>
              <input type="text" id="targetAudience" required placeholder="مثال: السنة الأولى / الثانية">
            </div>
            <div class="form-group">
              <label>اختيار المركز في منصة التتويج</label>
              <select id="manualRank">
                <option value="auto">تلقائي (ترتيب حسب الإعجابات)</option>
                <option value="1">المركز الأول 🥇</option>
                <option value="2">المركز الثاني 🥈</option>
                <option value="3">المركز الثالث 🥉</option>
              </select>
            </div>
            <div class="form-group full-width">
              <label>الهدف التربوي من النشاط</label>
              <textarea id="educationalGoal" rows="3" required placeholder="اكتب الهدف التربوي..."></textarea>
            </div>
            <div class="form-group full-width">
              <label>صورة النشاط</label>
              <input type="file" id="imageInput" accept="image/*">
            </div>
          </div>
          <button type="submit" class="btn-submit">نشر النشاط للمشاركة</button>
        </form>
      </section>

      <!-- Podium Top 3 -->
      <section class="leaderboard-section">
        <h2 class="section-title"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i> منصة التتويج (المركز الأول، الثاني والثالث)</h2>
        <div class="podium-grid" id="podiumGrid"></div>
      </section>

      <section>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
          <h2 class="section-title"><i class="fa-solid fa-list-check"></i> جميع الأنشطة المشاركة</h2>
          <div class="user-votes-badge" id="votesLeftBadge">الإعجابات المتبقية لك: 3</div>
        </div>
        <div class="activities-grid" id="activitiesGrid"></div>
      </section>
    </main>
  </div>

  <script>
    let activities = JSON.parse(localStorage.getItem('almanar_activities')) || [
      {
        id: '1',
        teacherName: 'الأستاذة مريم',
        topic: 'ورشة حفظ أذكار الصباح',
        target: 'السنة الأولى ابتدائي',
        goal: 'ترسيخ العادات الأسبوعية وتدريب التلميذات.',
        likes: 5,
        manualRank: 'auto',
        image: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=600&q=80'
      }
    ];

    let userLikes = JSON.parse(localStorage.getItem('almanar_user_likes')) || [];
    let isAdmin = false;
    const MAX_LIKES = 3;
    const ADMIN_PASSWORD = "1234";

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', newTheme);
      themeToggle.innerHTML = newTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    });

    const adminToggle = document.getElementById('adminToggle');
    const adminBar = document.getElementById('adminBar');

    adminToggle.addEventListener('click', () => {
      if (!isAdmin) {
        const pass = prompt("الرجاء إدخال كلمة سر المشرف (Admin):");
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          document.body.classList.add('is-admin');
          adminBar.classList.add('active');
          alert("تم الدخول لوحة الإدارة بنجاح!");
        } else if (pass !== null) {
          alert("كلمة السر غير صحيحة!");
        }
      } else {
        isAdmin = false;
        document.body.classList.remove('is-admin');
        adminBar.classList.remove('active');
        alert("تم الخروج من وضع الإدارة.");
      }
    });

    document.getElementById('btnClearAll').addEventListener('click', () => {
      if(!isAdmin) return;
      if(confirm('هل أنت تأكد من مسح جميع الأنشطة نهائياً؟')) {
        activities = [];
        saveAndRender();
      }
    });

    document.getElementById('activityForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files[0];

      const newAct = {
        id: Date.now().toString(),
        teacherName: document.getElementById('teacherName').value,
        topic: document.getElementById('activityTopic').value,
        target: document.getElementById('targetAudience').value,
        manualRank: document.getElementById('manualRank').value,
        goal: document.getElementById('educationalGoal').value,
        likes: 0,
        image: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=600&q=80'
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          newAct.image = evt.target.result;
          activities.push(newAct);
          saveAndRender();
          e.target.reset();
        };
        reader.readAsDataURL(file);
      } else {
        activities.push(newAct);
        saveAndRender();
        e.target.reset();
      }
    });

    function saveAndRender() {
      localStorage.setItem('almanar_activities', JSON.stringify(activities));
      localStorage.setItem('almanar_user_likes', JSON.stringify(userLikes));
      render();
    }

    function toggleLike(id) {
      const likedIndex = userLikes.indexOf(id);
      const act = activities.find(a => a.id === id);

      if (likedIndex > -1) {
        userLikes.splice(likedIndex, 1);
        if(act) act.likes--;
      } else {
        if (userLikes.length >= MAX_LIKES) {
          alert('لقد استنفذت حد الإعجابات المسموح به (3 إعجابات كحد أقصى)!');
          return;
        }
        userLikes.push(id);
        if(act) act.likes++;
      }
      saveAndRender();
    }

    function deleteActivity(id) {
      if(!isAdmin) {
        alert("عذراً، خاصية الحذف مخصصة للأدمين فقط!");
        return;
      }
      activities = activities.filter(a => a.id !== id);
      userLikes = userLikes.filter(lId => lId !== id);
      saveAndRender();
    }

    function render() {
      document.getElementById('votesLeftBadge').innerText = `الإعجابات المتبقية لك: ${MAX_LIKES - userLikes.length}`;

      const grid = document.getElementById('activitiesGrid');
      grid.innerHTML = '';
      
      activities.forEach(act => {
        const isLiked = userLikes.includes(act.id);
        const card = document.createElement('div');
        card.className = 'activity-card';
        card.innerHTML = `
          <div class="admin-card-actions">
            <button class="btn-delete-card" onclick="deleteActivity('${act.id}')">حذف النشاط</button>
          </div>
          <img src="${act.image}" class="activity-img" alt="صورة النشاط">
          <div class="activity-body">
            <div class="teacher-name">${act.teacherName}</div>
            <div class="activity-topic">${act.topic}</div>
            <div class="activity-info"><strong>الفئة:</strong> ${act.target}</div>
            <div class="activity-info"><strong>الهدف:</strong> ${act.goal}</div>
            <div class="activity-footer">
              <button class="btn-like ${isLiked ? 'liked' : ''}" onclick="toggleLike('${act.id}')">
                <i class="fa-heart ${isLiked ? 'fa-solid' : 'fa-regular'}"></i> ${act.likes} إعجاب
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // منطق تحديد المراكز (يدوي أو تلقائي)
      let podiumList = [null, null, null];

      activities.forEach(act => {
        if (act.manualRank === '1' && !podiumList[0]) podiumList[0] = act;
        if (act.manualRank === '2' && !podiumList[1]) podiumList[1] = act;
        if (act.manualRank === '3' && !podiumList[2]) podiumList[2] = act;
      });

      const remainingActivities = [...activities]
        .filter(act => !podiumList.includes(act))
        .sort((a, b) => b.likes - a.likes);

      for (let i = 0; i < 3; i++) {
        if (!podiumList[i] && remainingActivities.length > 0) {
          podiumList[i] = remainingActivities.shift();
        }
      }

      const podiumGrid = document.getElementById('podiumGrid');
      podiumGrid.innerHTML = '';

      const rankLabels = ["المركز الأول 🥇", "المركز الثاني 🥈", "المركز الثالث 🥉"];

      podiumList.forEach((act, idx) => {
        const pCard = document.createElement('div');
        pCard.className = `podium-card rank-${idx + 1}`;
        if (act) {
          pCard.innerHTML = `
            <div class="badge-rank">${rankLabels[idx]}</div>
            <h3 style="margin-top:15px; font-size:1.3rem; color:var(--accent-cyan);">${act.teacherName}</h3>
            <p style="margin: 5px 0; font-weight:700;">${act.topic}</p>
            <div style="font-weight:bold; font-size:1.2rem; margin-top:10px; color:var(--accent-gold);">
              ❤️ ${act.likes} إعجاب
            </div>
          `;
        } else {
          pCard.innerHTML = `
            <div class="badge-rank">${rankLabels[idx]}</div>
            <h3 style="margin-top:25px; color:var(--text-muted);">مفاجأة قادمة</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">في انتظار انضمام الأنشطة...</p>
          `;
        }
        podiumGrid.appendChild(pCard);
      });
    }

    render();
  </script>
</body>
</html>
