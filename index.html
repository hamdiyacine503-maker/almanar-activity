<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ابتدائية المنار القرآنية إناث - أفضل نشاط شهر أكتوبر 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.85);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-rose: #f43f5e;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] {
      --bg-primary: #f0fdf4;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent-cyan: #0284c7;
      --accent-gold: #d97706;
      --accent-green: #059669;
      --accent-rose: #e11d48;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 10px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 30px 20px;
      margin-bottom: 30px;
      text-align: center;
      position: relative;
    }

    .header-top-controls {
      position: absolute;
      top: 15px;
      left: 15px;
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .school-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.8);
    }

    .event-title {
      font-size: 1.1rem;
      color: var(--accent-gold);
      font-weight: 700;
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      padding: 6px 18px;
      border-radius: 50px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .admin-bar {
      display: none;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      justify-content: space-between;
      align-items: center;
    }

    .admin-bar.active { display: flex; }

    .btn-danger {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* منصة التتويج مخفية افتراضياً وتظهر فقط للأدمين */
    .podium-section {
      display: none;
      margin-bottom: 40px;
    }

    body.is-admin .podium-section {
      display: block;
    }

    .podium-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .podium-card {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 18px;
      padding: 20px;
      position: relative;
      text-align: center;
    }

    .podium-card.rank-1 { border-color: #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
    .podium-card.rank-2 { border-color: #94a3b8; box-shadow: 0 0 20px rgba(148, 163, 184, 0.2); }
    .podium-card.rank-3 { border-color: #b45309; box-shadow: 0 0 20px rgba(180, 83, 9, 0.2); }

    .badge-rank {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      color: white;
    }

    .rank-1 .badge-rank { background: #f59e0b; }
    .rank-2 .badge-rank { background: #94a3b8; }
    .rank-3 .badge-rank { background: #b45309; }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 40px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width { grid-column: 1 / -1; }

    label { font-weight: 700; font-size: 0.9rem; }

    input, textarea {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      outline: none;
      font-size: 0.95rem;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-cyan), #3b82f6);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }

    .activities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .activity-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .activity-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #000;
    }

    .activity-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .teacher-name { color: var(--accent-cyan); font-weight: 800; font-size: 1rem; }
    .activity-topic { font-size: 1.1rem; font-weight: 700; margin: 5px 0; }
    .activity-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }

    .video-link-btn {
      display: inline-block;
      margin: 8px 0;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
    }

    .voting-section {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vote-buttons {
      display: flex;
      gap: 5px;
      justify-content: space-between;
    }

    .btn-vote {
      flex: 1;
      padding: 6px 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
    }

    .btn-vote.voted-1 { background: #f59e0b; color: white; border-color: #f59e0b; }
    .btn-vote.voted-2 { background: #94a3b8; color: white; border-color: #94a3b8; }
    .btn-vote.voted-3 { background: #b45309; color: white; border-color: #b45309; }

    /* إخفاء عداد الأصوات عن المستخدم العادي وإظهاره للأدمين */
    .vote-count {
      display: none;
    }

    body.is-admin .vote-count {
      display: inline;
    }

    .admin-actions {
      position: absolute;
      top: 10px;
      left: 10px;
      display: none;
    }

    body.is-admin .admin-actions { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top-controls">
        <button class="btn-icon" id="themeToggle" title="تبديل الوضع"><i class="fa-solid fa-moon"></i></button>
        <button class="btn-icon" id="adminToggle" title="دخول المشرف"><i class="fa-solid fa-user-shield"></i></button>
      </div>
      <h1 class="school-title">ابتدائية المنار القرآنية إناث</h1>
      <div class="event-title">🏆 مسابقة أفضل نشاط تربوي - شهر أكتوبر 2026م</div>
    </header>

    <div class="admin-bar" id="adminBar">
      <span>⚙️ <strong>وضع المشرف مفعل:</strong> يمكنك الاطلاع على نتائج التصويت ومسح الأنشطة.</span>
      <button class="btn-danger" id="btnClearAll">مسح الكل</button>
    </div>

    <main>
      <section class="form-card">
        <h2 class="section-title"><i class="fa-solid fa-plus-circle"></i> إضافة نشاط جديد للمشاركة</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>اسم الأستاذ(ة)</label>
            <input type="text" id="teacherName" placeholder="الاسم واللقب">
          </div>
          <div class="form-group">
            <label>موضوع النشاط</label>
            <input type="text" id="activityTopic" placeholder="عنوان النشاط">
          </div>
          <div class="form-group">
            <label>الفئة المستهدفة</label>
            <input type="text" id="targetAudience" placeholder="مثال: السنة الأولى">
          </div>
          <div class="form-group">
            <label>رابط الفيديو (اختياري)</label>
            <input type="url" id="videoLink" placeholder="https://youtube.com/...">
          </div>
          <div class="form-group full-width">
            <label>الهدف التربوي</label>
            <textarea id="educationalGoal" rows="2" placeholder="اكتب الهدف التربوي..."></textarea>
          </div>
          <div class="form-group full-width">
            <label>صورة النشاط (اختياري)</label>
            <input type="file" id="imageInput" accept="image/*">
          </div>
        </div>
        <button type="button" class="btn-submit" onclick="publishActivity()">نشر النشاط</button>
      </section>

      <!-- منصة التتويج تظهر للمشرف فقط -->
      <section class="podium-section">
        <h2 class="section-title"><i class="fa-solid fa-trophy" style="color:#f59e0b;"></i> نتائج المنصة (خاص بالمشرف)</h2>
        <div class="podium-grid" id="podiumGrid"></div>
      </section>

      <section>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <h2 class="section-title"><i class="fa-solid fa-list-check"></i> الأنشطة المشاركة (صوت لـ 3 أنشطة كحد أقصى)</h2>
          <span id="votesLeftBadge" style="color:var(--accent-green); font-weight:bold;">الأصوات المتبقية لك: 3</span>
        </div>
        <div class="activities-grid" id="activitiesGrid"></div>
      </section>
    </main>
  </div>

  <script>
    let activities = JSON.parse(localStorage.getItem('almanar_activities')) || [];
    let userVotes = JSON.parse(localStorage.getItem('almanar_user_votes')) || {};
    let isAdmin = false;
    const MAX_VOTES = 3;
    const ADMIN_PASS = "1593";

    document.getElementById('themeToggle').addEventListener('click', () => {
      const isLight = document.body.getAttribute('data-theme') === 'light';
      document.body.setAttribute('data-theme', isLight ? 'dark' : 'light');
    });

    document.getElementById('adminToggle').addEventListener('click', () => {
      if (!isAdmin) {
        if (prompt("أدخل الرقم السري للمشرف:") === ADMIN_PASS) {
          isAdmin = true;
          document.body.classList.add('is-admin');
          document.getElementById('adminBar').classList.add('active');
          alert("تم دخول لوحة المشرف وإظهار نتائج التصويت بنجاح!");
        } else { alert("الرقم السري خاطئ!"); }
      } else {
        isAdmin = false;
        document.body.classList.remove('is-admin');
        document.getElementById('adminBar').classList.remove('active');
        alert("تم الخروج من وضع المشرف وإخفاء النتائج.");
      }
    });

    document.getElementById('btnClearAll').addEventListener('click', () => {
      if(isAdmin && confirm('مسح جميع الأنشطة؟')) {
        activities = [];
        userVotes = {};
        saveAndRender();
      }
    });

    function publishActivity() {
      const name = document.getElementById('teacherName').value.trim();
      const topic = document.getElementById('activityTopic').value.trim();
      const target = document.getElementById('targetAudience').value.trim();
      const goal = document.getElementById('educationalGoal').value.trim();
      const video = document.getElementById('videoLink').value.trim();

      if (!name || !topic || !target || !goal) {
        alert('الرجاء ملء جميع الحقول الإلزامية!');
        return;
      }

      const fileInput = document.getElementById('imageInput');
      const file = fileInput.files ? fileInput.files[0] : null;
      const defaultImage = 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=600&q=80';

      const saveNewAct = (imgSrc) => {
        const newAct = {
          id: Date.now().toString(),
          teacherName: name,
          topic: topic,
          target: target,
          goal: goal,
          videoLink: video,
          votes: { 1: 0, 2: 0, 3: 0 },
          image: imgSrc
        };
        activities.push(newAct);
        saveAndRender();
        
        document.getElementById('teacherName').value = '';
        document.getElementById('activityTopic').value = '';
        document.getElementById('targetAudience').value = '';
        document.getElementById('educationalGoal').value = '';
        document.getElementById('videoLink').value = '';
        fileInput.value = '';
        alert('تم نشر النشاط بنجاح!');
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { saveNewAct(evt.target.result); };
        reader.onerror = () => { saveNewAct(defaultImage); };
        reader.readAsDataURL(file);
      } else {
        saveNewAct(defaultImage);
      }
    }

    function saveAndRender() {
      localStorage.setItem('almanar_activities', JSON.stringify(activities));
      localStorage.setItem('almanar_user_votes', JSON.stringify(userVotes));
      render();
    }

    function voteActivity(id, rank) {
      const currentVoteForThis = userVotes[id];

      if (currentVoteForThis === rank) {
        delete userVotes[id];
        activities.find(a => a.id === id).votes[rank]--;
      } else {
        if (currentVoteForThis) {
          activities.find(a => a.id === id).votes[currentVoteForThis]--;
          delete userVotes[id];
        }

        if (Object.keys(userVotes).length >= MAX_VOTES) {
          alert('لقد استهلكت أصواتك الثلاثة المسموح بها! يمكنك إلغاء صوت سابق لتغييره.');
          return;
        }

        userVotes[id] = rank;
        activities.find(a => a.id === id).votes[rank]++;
      }
      saveAndRender();
    }

    function deleteAct(id) {
      if(isAdmin) {
        activities = activities.filter(a => a.id !== id);
        delete userVotes[id];
        saveAndRender();
      }
    }

    function render() {
      const usedVotes = Object.keys(userVotes).length;
      document.getElementById('votesLeftBadge').innerText = `الأصوات المتبقية لك: ${MAX_VOTES - usedVotes}`;
      
      const grid = document.getElementById('activitiesGrid');
      grid.innerHTML = '';

      activities.forEach(act => {
        const myVote = userVotes[act.id];
        grid.innerHTML += `
          <div class="activity-card">
            <div class="admin-actions">
              <button class="btn-danger" onclick="deleteAct('${act.id}')">حذف</button>
            </div>
            <img src="${act.image}" class="activity-img">
            <div class="activity-body">
              <div class="teacher-name">${act.teacherName}</div>
              <div class="activity-topic">${act.topic}</div>
              <div class="activity-info"><strong>الفئة:</strong> ${act.target}</div>
              <div class="activity-info"><strong>الهدف:</strong> ${act.goal}</div>
              ${act.videoLink ? `<a href="${act.videoLink}" target="_blank" class="video-link-btn"><i class="fa-solid fa-video"></i> مشاهدة فيديو النشاط</a>` : ''}
              
              <div class="voting-section">
                <span style="font-size:0.85rem; font-weight:bold;">ترشيح النشاط:</span>
                <div class="vote-buttons">
                  <button class="btn-vote ${myVote === 1 ? 'voted-1' : ''}" onclick="voteActivity('${act.id}', 1)">
                    🥇 أول <span class="vote-count">(${act.votes[1]})</span>
                  </button>
                  <button class="btn-vote ${myVote === 2 ? 'voted-2' : ''}" onclick="voteActivity('${act.id}', 2)">
                    🥈 ثاني <span class="vote-count">(${act.votes[2]})</span>
                  </button>
                  <button class="btn-vote ${myVote === 3 ? 'voted-3' : ''}" onclick="voteActivity('${act.id}', 3)">
                    🥉 ثالث <span class="vote-count">(${act.votes[3]})</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      });

      // إعداد بيانات منصة التتويج للمشرف
      let podium = [null, null, null];
      [1, 2, 3].forEach((rankIdx, arrayIdx) => {
        let bestAct = null;
        let maxVotes = -1;
        activities.forEach(act => {
          if (act.votes[rankIdx] > maxVotes) {
            maxVotes = act.votes[rankIdx];
            bestAct = act;
          }
        });
        if (maxVotes > 0) podium[arrayIdx] = bestAct;
      });

      const podiumGrid = document.getElementById('podiumGrid');
      podiumGrid.innerHTML = '';
      const titles = ["المركز الأول 🥇", "المركز الثاني 🥈", "المركز الثالث 🥉"];

      podium.forEach((act, idx) => {
        const rankNum = idx + 1;
        podiumGrid.innerHTML += `
          <div class="podium-card rank-${rankNum}">
            <div class="badge-rank">${titles[idx]}</div>
            ${act ? `
              <h3 style="margin-top:20px; color:var(--accent-cyan);">${act.teacherName}</h3>
              <p style="font-weight:bold; margin:5px 0;">${act.topic}</p>
              <div style="color:var(--accent-gold); font-weight:bold;">⭐ الأصوات: ${act.votes[rankNum]}</div>
            ` : `
              <h3 style="margin-top:25px; color:var(--text-muted);">لا توجد أصوات بعد</h3>
            `}
          </div>
        `;
      });
    }

    render();
  </script>
</body>
</html>
